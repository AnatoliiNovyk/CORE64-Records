server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS for upstream hostnames (Kong / sslip).
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Security headers for HTML (and inherited responses). `always` so they
    # apply on error responses too. Static-asset location below re-declares
    # them because nginx does not inherit add_header across locations.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://supabasekong.169.58.250.236.sslip.io wss://supabasekong.169.58.250.236.sslip.io https://www.google.com https://www.gstatic.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://www.google.com;" always;

    # Real HTTP 404 for unknown paths (Package A soft-404 fix).
    # Known SPA routes: / and /admin*. Hash routes (#section) stay on /.
    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    location = /sitemap.xml {
        try_files $uri =404;
    }

    location = /llms.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    # Static legal stubs (real HTML 200, not SPA shell)
    location = /privacy {
        try_files /privacy.html =404;
    }
    location = /privacy/ {
        return 301 /privacy;
    }
    location = /privacy.html {
        try_files $uri =404;
    }

    location = /terms {
        try_files /terms.html =404;
    }
    location = /terms/ {
        return 301 /terms;
    }
    location = /terms.html {
        try_files $uri =404;
    }

    # Same-origin public media proxy: strip Kong x-robots-tag: none so
    # cover/gallery assets can be indexed when referenced from the site.
    # Upstream: internal Kong on coolify network (HTTP), fallback host via
    # the public sslip name if the container DNS name is unavailable.
    set $media_upstream http://supabase-kong-u1u6nno8jxtc1tsqv1arokts:8000;

    location ^~ /media/object/ {
        proxy_http_version 1.1;
        proxy_set_header Host supabasekong.169.58.250.236.sslip.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header x-robots-tag;
        proxy_hide_header Via;
        proxy_hide_header Server;
        proxy_hide_header X-Kong-Upstream-Latency;
        proxy_hide_header X-Kong-Proxy-Latency;
        proxy_hide_header X-Kong-Request-Id;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        rewrite ^/media/object/(.*)$ /storage/v1/object/public/media/$1 break;
        proxy_pass $media_upstream;
    }

    location ^~ /media/render/ {
        proxy_http_version 1.1;
        proxy_set_header Host supabasekong.169.58.250.236.sslip.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header x-robots-tag;
        proxy_hide_header Via;
        proxy_hide_header Server;
        proxy_hide_header X-Kong-Upstream-Latency;
        proxy_hide_header X-Kong-Proxy-Latency;
        proxy_hide_header X-Kong-Request-Id;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        rewrite ^/media/render/(.*)$ /storage/v1/render/image/public/media/$1 break;
        proxy_pass $media_upstream;
    }

    # Admin SPA shell (login + nested dashboard routes)
    location ^~ /admin {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff|ttf|webp|map)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://supabasekong.169.58.250.236.sslip.io wss://supabasekong.169.58.250.236.sslip.io https://www.google.com https://www.gstatic.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://www.google.com;" always;
        try_files $uri =404;
    }

    # Everything else: only real files; no SPA fallback → true 404
    location / {
        try_files $uri =404;
    }
}
