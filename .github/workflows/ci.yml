name: CI

# Deliberately no `pull_request` trigger.
#
# This runs on a self-hosted runner on the production VPS, and the repository is
# public. A `pull_request` trigger would let anyone's fork execute arbitrary
# workflow code on the box that also runs the site, Supabase and Coolify.
# Restricting to pushes on `main` removes that: only someone who can already
# push to `main` can cause the runner to execute anything.
#
# Use `workflow_dispatch` to run it by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: [self-hosted, core64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      # Build last: it is the slowest step and the cheap checks above catch most
      # failures first. The Supabase values are placeholders — the build only
      # needs them to be present, and nothing here talks to a real project.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_ANON_KEY: "placeholder-anon-key"
