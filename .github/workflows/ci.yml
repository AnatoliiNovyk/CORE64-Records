name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      # Build last: it is the slowest step and the cheap checks above catch most
      # failures first. Supabase vars are absent on CI by design — the app now
      # surfaces a configuration banner instead of pretending to work.
      - name: Build
        run: npm run build
